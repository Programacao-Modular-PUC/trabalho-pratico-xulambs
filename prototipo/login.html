<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RHSoft — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <h2>RH<span>Soft</span></h2>
            <p>Sistema de Recursos Humanos</p>
        </div>
        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input class="form-control" type="email" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label class="form-label">Senha</label>
            <input class="form-control" type="password" placeholder="••••••••">
        </div>
        <div style="margin-top: 24px;">
            <a href="dashboard.html">
                <button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
                    Entrar
                </button>
            </a>
        </div>
        <p style="text-align:center; font-size:13px; color:#888; margin-top:16px;">
            Esqueceu sua senha? <a href="#" style="color:#1a6ab0;">Redefinir</a>
        </p>
    </div>
</div>
</body>
</html>
